name: Publish 0.11.3 playtest

on:
  push:
    branches: [claude/release-0.11.3]

permissions:
  contents: write

concurrency:
  group: publish-v0.11.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build (includes the jar reference check)
        run: |
          bash ./gradlew clean build --no-daemon --console=plain
          test -s build/libs/villagers-repurposed-0.11.3.jar
          python3 tools/check-jar-refs.py build/libs/villagers-repurposed-0.11.3.jar
          python3 - <<'PYTHON'
          import json, zipfile
          with zipfile.ZipFile('build/libs/villagers-repurposed-0.11.3.jar') as archive:
              assert json.loads(archive.read('fabric.mod.json'))['version'] == '0.11.3'
          PYTHON
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/libs/villagers-repurposed-0.11.3.jar >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.11.3 build/libs/villagers-repurposed-0.11.3.jar \
            --target "$GITHUB_SHA" \
            --title "Villagers Repurposed 0.11.3 - fixes the 0.11.2 world-entry crash" \
            --notes-file RELEASE_NOTES_0.11.3.md \
            --prerelease --latest=false
      - name: Warn on the broken 0.11.2 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.11.2 --json body --jq .body > old-notes.md
          { printf '> **Known crash: this version can crash a world (NoClassDefFoundError: SocialChecks). Please use 0.11.3 instead.**\n\n'; cat old-notes.md; } > new-notes.md
          gh release edit v0.11.2 --notes-file new-notes.md
