name: Publish 0.11.4 playtest

on:
  push:
    branches: [claude/release-0.11.4]

permissions:
  contents: write

concurrency:
  group: publish-v0.11.4
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and verify the release jar
        run: |
          bash ./gradlew clean build --no-daemon --console=plain
          test -s build/libs/villagers-repurposed-0.11.4.jar
          python3 tools/check-jar-refs.py build/libs/villagers-repurposed-0.11.4.jar
          python3 - <<'PYTHON'
          import json, zipfile
          with zipfile.ZipFile('build/libs/villagers-repurposed-0.11.4.jar') as archive:
              assert json.loads(archive.read('fabric.mod.json'))['version'] == '0.11.4'
          PYTHON
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/libs/villagers-repurposed-0.11.4.jar >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.11.4 build/libs/villagers-repurposed-0.11.4.jar \
            --target "$GITHUB_SHA" \
            --title "Villagers: Repurposed 0.11.4 playtest" \
            --notes-file RELEASE_NOTES_0.11.4.md \
            --prerelease --latest=false
