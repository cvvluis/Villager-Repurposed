name: Publish playtest release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.jar \
            --title "Villagers: Repurposed ${GITHUB_REF_NAME#v}" \
            --notes-file release/NOTES.md \
            --prerelease
